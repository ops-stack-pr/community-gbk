<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#GBKUntukSemua | Community Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gbk-red: #D90429;
      --gbk-dark: #111827;
      --gbk-gray: #F3F4F6;
      --gbk-card: #FFFFFF;
      --gbk-text: #1F2937;
      --gbk-subtext: #4B5563;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--gbk-gray);
      color: var(--gbk-text);
      display: flex;
      justify-content: center;
      padding: 20px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* Sports Branding Header */
    .brand-header {
      background: var(--gbk-dark);
      color: #FFFFFF;
      padding: 24px 20px;
      border-radius: 16px 16px 0 0;
      text-align: center;
      border-bottom: 4px solid var(--gbk-red);
    }

    /* Centered Small GBK Logo */
    .gbk-logo {
      display: block;
      margin: 0 auto 12px auto;
      height: 48px;
      width: auto;
    }

    .brand-tag {
      display: inline-block;
      background: var(--gbk-red);
      color: #FFF;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    <div class="brand-header">
      <img src="logo-gbk.png" alt="GBK Logo" class="gbk-logo">
      <span class="brand-tag">#GBKUntukSemua</span>
      <h1>Community Hub</h1>
    </div>
    }

    /* Tab Switcher */
    .tab-switch {
      display: flex;
      background: #E5E7EB;
      padding: 4px;
      border-radius: 0 0 16px 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      font-weight: 700;
      font-size: 14px;
      color: var(--gbk-subtext);
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #FFFFFF;
      color: var(--gbk-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Form Container Card */
    .form-card {
      background: var(--gbk-card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .headline {
      font-size: 15px;
      font-weight: 700;
      color: var(--gbk-dark);
      margin-bottom: 20px;
      line-height: 1.4;
      padding-left: 10px;
      border-left: 3px solid var(--gbk-red);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gbk-subtext);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      background: #FAFAFA;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--gbk-red);
      background: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--gbk-red);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: #B91C1C;
    }

    .btn-submit:disabled {
      background: #9CA3AF;
      cursor: not-allowed;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <img src="logo-gbk.png" alt="GBK Logo" class="gbk-logo">
      <span class="brand-tag">#GBKUntukSemua</span>
      <h1>Community Hub</h1>
    </div>

    <div class="tab-switch">
      <button class="tab-btn active" id="tabFeedbackBtn" onclick="switchTab('feedback')">Feedback</button>
      <button class="tab-btn" id="tabInfoBtn" onclick="switchTab('info')">Community Info</button>
    </div>

    <div id="feedbackSection" class="form-card">
      <div class="headline">
        #GBKUntukSemua Means Your Voice Matters.
        <br/>Help Us Build a Better Space for Everyone
      </div>
      <form id="feedbackForm">
        <div class="form-group">
          <label>Community Name</label>
          <input type="text" id="fb_communityName" placeholder="e.g. GBK Runners" required>
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input type="text" id="fb_contact" placeholder="WhatsApp / Phone Number" required>
        </div>
        <div class="form-group">
          <label>Username Instagram</label>
          <input type="text" id="fb_instagram" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Feedback</label>
          <textarea id="fb_feedback" rows="3" placeholder="Tell us your suggestions or experience..." required></textarea>
        </div>
        <div class="form-group">
          <label>Ratings</label>
          <select id="fb_ratings" required>
            <option value="5">⭐⭐⭐⭐⭐ (5/5) Excellent</option>
            <option value="4">⭐⭐⭐⭐ (4/5) Good</option>
            <option value="3">⭐⭐⭐ (3/5) Average</option>
            <option value="2">⭐⭐ (2/5) Needs Improvement</option>
            <option value="1">⭐ (1/5) Poor</option>
          </select>
        </div>
        <button type="submit" id="fb_btn" class="btn-submit">Submit Feedback</button>
      </form>
    </div>

    <div id="infoSection" class="form-card hidden">
      <div class="headline">
        #GBKUntukSemua Every Community Belongs Here:
        <br/>Drop Your Community Info Below
      </div>
      <form id="infoForm">
        <div class="form-group">
          <label>Community Name</label>
          <input type="text" id="info_communityName" placeholder="e.g. GBK Basketball Club" required>
        </div>
        <div class="form-group">
          <label>Contact PIC</label>
          <input type="text" id="info_contactPic" placeholder="Whatsapp / Phone Number" required>
        </div>
        <div class="form-group">
          <label>Username Instagram</label>
          <input type="text" id="info_instagram" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Number of Members</label>
          <input type="number" id="info_members" placeholder="Approximate total members" required>
        </div>
        <div class="form-group">
          <label>Usual Playing Location</label>
          <input type="text" id="info_playingLocation" placeholder="e.g. Plaza Sudirman / Plaza Parkir Timur" required>
        </div>
        <button type="submit" id="info_btn" class="btn-submit">Register Community</button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIe9sw9dSks1ZAOOlPfuN7nfR6BY_IoBzV17WXum10kum_3A7ylRluWGOQy99FRpxAJA/exec";

    function switchTab(tab) {
      const fbSection = document.getElementById('feedbackSection');
      const infoSection = document.getElementById('infoSection');
      const fbBtn = document.getElementById('tabFeedbackBtn');
      const infoBtn = document.getElementById('tabInfoBtn');

      if (tab === 'feedback') {
        fbSection.classList.remove('hidden');
        infoSection.classList.add('hidden');
        fbBtn.classList.add('active');
        infoBtn.classList.remove('active');
      } else {
        infoSection.classList.remove('hidden');
        fbSection.classList.add('hidden');
        infoBtn.classList.add('active');
        fbBtn.classList.remove('active');
      }
    }

    // Submit Feedback
    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('fb_btn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      const payload = {
        type: "feedback",
        communityName: document.getElementById('fb_communityName').value,
        contact: document.getElementById('fb_contact').value,
        instagram: document.getElementById('fb_instagram').value,
        feedback: document.getElementById('fb_feedback').value,
        ratings: document.getElementById('fb_ratings').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('Thank you! Your feedback has been recorded.');
        document.getElementById('feedbackForm').reset();
        btn.innerText = "Submit Feedback";
        btn.disabled = false;
      }).catch(() => {
        alert('Submission failed. Please check your network.');
        btn.disabled = false;
      });
    });

    // Submit Community Info
    document.getElementById('infoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('info_btn');
      btn.innerText = "Registering...";
      btn.disabled = true;

      const payload = {
        type: "database",
        communityName: document.getElementById('info_communityName').value,
        contactPic: document.getElementById('info_contactPic').value,
        instagram: document.getElementById('info_instagram').value,
        members: document.getElementById('info_members').value,
        playingLocation: document.getElementById('info_playingLocation').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('Community registered successfully!');
        document.getElementById('infoForm').reset();
        btn.innerText = "Register Community";
        btn.disabled = false;
      }).catch(() => {
        alert('Submission failed. Please check your network.');
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
