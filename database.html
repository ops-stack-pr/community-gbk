<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community List & Database</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 15px; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; margin-top: 18px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <h2>GBK Community Registration</h2>
  <form id="databaseForm">
    <label>Community Name</label>
    <input type="text" id="communityName" required>

    <label>Contact PIC</label>
    <input type="text" id="contactPic" placeholder="Name & Phone" required>

    <label>Username Instagram</label>
    <input type="text" id="instagram" placeholder="@username" required>

    <label>Number of Members</label>
    <input type="number" id="members" placeholder="e.g. 50" required>

    <label>Usual Playing Location</label>
    <input type="text" id="playingLocation" placeholder="e.g. GBK Basket Hall / Outdoor" required>

    <button type="submit" id="btn">Register Community</button>
  </form>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIe9sw9dSks1ZAOOlPfuN7nfR6BY_IoBzV17WXum10kum_3A7ylRluWGOQy99FRpxAJA/exec";

    document.getElementById('databaseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      const payload = {
        type: "database",
        communityName: document.getElementById('communityName').value,
        contactPic: document.getElementById('contactPic').value,
        instagram: document.getElementById('instagram').value,
        members: document.getElementById('members').value,
        playingLocation: document.getElementById('playingLocation').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('Community registered successfully!');
        document.getElementById('databaseForm').reset();
        btn.innerText = "Register Community";
        btn.disabled = false;
      }).catch(err => {
        alert('Submission error.');
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
