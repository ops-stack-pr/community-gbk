<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Feedback Form</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 15px; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; margin-top: 18px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <h2>GBK Community Feedback</h2>
  <form id="feedbackForm">
    <label>Community Name</label>
    <input type="text" id="communityName" required>

    <label>Contact</label>
    <input type="text" id="contact" placeholder="WhatsApp / Phone" required>

    <label>Username Instagram</label>
    <input type="text" id="instagram" placeholder="@username">

    <label>Feedback</label>
    <textarea id="feedback" rows="4" required></textarea>

    <label>Ratings (1 - 5)</label>
    <select id="ratings" required>
      <option value="5">5 - Excellent</option>
      <option value="4">4 - Good</option>
      <option value="3">3 - Average</option>
      <option value="2">2 - Poor</option>
      <option value="1">1 - Very Poor</option>
    </select>

    <button type="submit" id="btn">Submit Feedback</button>
  </form>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIe9sw9dSks1ZAOOlPfuN7nfR6BY_IoBzV17WXum10kum_3A7ylRluWGOQy99FRpxAJA/exec";

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      const payload = {
        type: "feedback",
        communityName: document.getElementById('communityName').value,
        contact: document.getElementById('contact').value,
        instagram: document.getElementById('instagram').value,
        feedback: document.getElementById('feedback').value,
        ratings: document.getElementById('ratings').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('Feedback submitted successfully!');
        document.getElementById('feedbackForm').reset();
        btn.innerText = "Submit Feedback";
        btn.disabled = false;
      }).catch(err => {
        alert('Submission error.');
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
